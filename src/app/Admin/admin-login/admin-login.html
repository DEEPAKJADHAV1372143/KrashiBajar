<div class="m-4 ">
 <section class="row ">
    <div class="col-md-9">
        <app-admin-register></app-admin-register>
    </div>
<div class="col-md-3">
     <div class="card shadow-lg p-4 mt-2">
        <div class="text-center">
                    <img src="https://png.pngtree.com/png-clipart/20250105/original/pngtree-user-profile-login-icon-in-silver-color-access-authentication-vector-png-image_19841391.png" width="75" alt="lo">

        </div>
    <h3 class="text-center mb-4">Admin Login</h3>

    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="row">
      <!-- Username -->
      <div class="pt-2 col-md-12">
        <label> <i class="fa fa-user"></i> Username:</label>
        <input
          class="form-control"
          type="text"
          name="username"
          [(ngModel)]="login.username"
          required
          minlength="4"
          #username="ngModel"
        />
        <div class="text-danger" *ngIf="username.invalid && username.touched">
          Username is required (min 4 chars).
        </div>
      </div>

      <!-- Password -->
      <div class="pt-2 col-md-12">
        <label> <i class="fa fa-lock"></i> Password:</label>
        <input
          class="form-control"
          type="password"
          name="userpassword"
          [(ngModel)]="login.userpassword"
          required
          minlength="6"
          #userpassword="ngModel"
        />
        <div
          class="text-danger"
          *ngIf="userpassword.invalid && userpassword.touched"
        >
          Password is required (min 6 chars).
        </div>
      </div>

      <!-- Buttons -->
      <div class="col-md-12 pt-3 text-center">
        <button
          type="submit"
          class="btn btn-sm btn-success"
          [disabled]="loginForm.invalid"
        >
          Login
        </button>
        <button type="reset" class="btn btn-sm btn-danger mx-3">Cancel</button>
      </div>
    </form>

   <!-- <div class="text-center mt-3">
              <a  class="text-decoration-none">Register New Admin</a>

      </div> -->
  </div>
</div>



 </section>

</div>

 <app-footer></app-footer>
