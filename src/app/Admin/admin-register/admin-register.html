<div class="justify-content-center align-items-center">
  <div class="card shadow-lg p-4 mt-2">
    <h3 class="text-center mb-4">Admin Registration (Create New Admin)</h3>

    <form (ngSubmit)="onSubmit(adminForm)" #adminForm="ngForm" class="row">
      <!-- First Name -->
      <div class="pt-2 col-md-6">
        <label>First Name:</label>
        <input
          class="form-control"
          type="text"
          name="firstName"
          [(ngModel)]="admin.firstName"
          required
          minlength="2"
          #firstName="ngModel"
        />
        <div class="text-danger" *ngIf="firstName.invalid && firstName.touched">
          First name is required and must be at least 2 characters.
        </div>
      </div>

      <!-- Last Name -->
      <div class="pt-2 col-md-6">
        <label>Last Name:</label>
        <input
          class="form-control"
          type="text"
          name="lastName"
          [(ngModel)]="admin.lastName"
          required
          minlength="2"
          #lastName="ngModel"
        />
        <div class="text-danger" *ngIf="lastName.invalid && lastName.touched">
          Last name is required and must be at least 2 characters.
        </div>
      </div>

      <!-- Email -->
      <div class="pt-2 col-md-6">
        <label>Email:</label>
        <input
          class="form-control"
          type="email"
          name="emailId"
          [(ngModel)]="admin.emailId"
          required
          #email="ngModel"
        />
        <div class="text-danger" *ngIf="email.invalid && email.touched">
          A valid email is required.
        </div>
      </div>

      <!-- Mobile -->
      <div class="pt-2 col-md-6">
        <label>Mobile:</label>
        <input
          class="form-control"
          type="text"
          name="mobile"
          [(ngModel)]="admin.mobile"
          required
          pattern="^[0-9]{10}$"
          maxlength="10"
          #mobile="ngModel"
        />
        <div class="text-danger" *ngIf="mobile.invalid && mobile.touched">
          Mobile number must be exactly 10 digits.
        </div>
      </div>

      <!-- Image -->
      <div class="pt-2 col-md-6">
        <label>Admin Image:</label>
        <input class="form-control" type="file" (change)="onFileSelected($event)" required />
        <div class="text-danger" *ngIf="!selectedFile && adminForm.submitted">
          Image is required.
        </div>
      </div>

      <!-- Buttons -->
      <div class="col-md-12 pt-3">
        <button type="submit" class="btn btn-sm btn-success" [disabled]="adminForm.invalid">
          Register Admin
        </button>
        <button type="reset" class="btn btn-sm btn-danger mx-3">Cancel</button>
      </div>
    </form>

    <!-- Back to Login -->
    <!-- <div class="text-center mt-3">
      <a [routerLink]="'/admin'" class="text-decoration-none">Back to Login</a>
    </div> -->

    <!-- Success/Error Messages -->
    <div class="mt-3">
      <div class="alert alert-success" *ngIf="successMessage">
        {{ successMessage }}
      </div>
      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </div>
  </div>
</div>
